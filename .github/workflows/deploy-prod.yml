name: Production Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  evaluation-regression:
    uses: ./.github/workflows/evaluation-regression.yml

  ci-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Django check
        working-directory: backend
        run: python manage.py check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Next.js build
        working-directory: frontend
        run: npm run build

  deploy:
    needs: [ci-test, evaluation-regression]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production images
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile.prod -t dev-backend:latest backend
          docker tag dev-backend:latest dev-lodging-warmer:latest
          docker build \
            -f frontend/Dockerfile.prod \
            --build-arg YOUTUBE_API_KEY="$YOUTUBE_API_KEY" \
            -t dev-frontend:latest \
            frontend
          docker build -f docker/jev-browser/Dockerfile -t dev-jev-browser:latest docker/jev-browser
          docker save \
            dev-backend:latest \
            dev-lodging-warmer:latest \
            dev-frontend:latest \
            dev-jev-browser:latest | gzip -1 > "$RUNNER_TEMP/production-images.tar.gz"

      - name: Configure SSH for image transfer
        env:
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/prod_ec2
          chmod 600 ~/.ssh/prod_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Clean up production EC2 before image transfer
        env:
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          # 이전 배포에서 남은 압축 파일 제거
          ssh -i ~/.ssh/prod_ec2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'rm -f ~/production-images.tar.gz'

          # 사용하지 않는 이미지와 빌드 캐시 정리
          ssh -i ~/.ssh/prod_ec2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'docker image prune -af && docker builder prune -af'

          # 디스크 상태 확인
          ssh -i ~/.ssh/prod_ec2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            'df -h && df -i && docker system df'

      - name: Transfer production images to EC2
        env:
          EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/prod_ec2 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/production-images.tar.gz" \
            "$EC2_USER@$EC2_HOST:production-images.tar.gz"

      - name: Deploy to production EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd ~/dev

            # 1. 배포 전 디스크 상태 확인 및 리소스 정리
            echo "===== 운영 서버 사전 점검 ====="
            df -h
            df -i
            docker system df

            docker image prune -af
            docker builder prune -af

            # 운영 볼륨은 데이터 손실 방지를 위해 자동 삭제하지 않음
            # 삭제 전 docker volume ls 및 docker system df -v로 확인할 것

            # 2. 최신 main 코드 반영
            echo "===== Git 업데이트 ====="
            git fetch origin main
            git merge --ff-only origin/main

            # 3. GitHub Actions에서 전달된 이미지 로드
            echo "===== 운영 이미지 로드 ====="
            docker load -i ~/production-images.tar.gz
            rm -f ~/production-images.tar.gz

            # 4. 기존 Mailpit 중지
            docker compose stop mailpit || true

            # 5. 운영 서비스 배포
            echo "===== 운영 서비스 배포 ====="
            docker compose \
              -p dev \
              -f docker-compose.prod.yml \
              up -d --no-build \
              backend frontend nginx minio jev-browser lodging-warmer

            # 6. Nginx 설정 검증
            echo "===== Nginx 설정 검증 ====="
            docker compose \
              -p dev \
              -f docker-compose.prod.yml \
              exec -T nginx nginx -t

            # 7. 헬스 체크
            echo "===== 운영 헬스 체크 ====="
            curl --fail --silent --show-error --insecure \
              https://localhost/api/v1/healthz/

            curl --fail --silent --show-error --insecure \
              https://localhost/

            # 8. 배포 후 리소스 정리
            echo "===== 배포 후 Docker 정리 ====="
            docker image prune -af
            docker builder prune -af

            # 9. 최종 상태 확인
            echo "===== 최종 디스크 상태 ====="
            df -h
            df -i
            docker system df

            echo "===== 운영 서버 배포 완료 ====="

  notify-discord:
    needs: [ci-test, evaluation-regression, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send production deployment notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.ci-test.result }}
          EVALUATION_RESULT: ${{ needs.evaluation-regression.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi

          if [ "$CI_RESULT" = "failure" ] || [ "$EVALUATION_RESULT" = "failure" ]; then
            STATUS="❌ [운영 CI 실패]"
            DETAILS="운영 배포 전 CI 검증에서 오류가 발생했습니다."
          else
            STATUS="❌ [운영 배포 실패]"
            DETAILS="운영 EC2 배포 중 오류가 발생했습니다."
          fi

          ACTION_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="**${STATUS}**
          • **Repository:** ${{ github.repository }}
          • **Branch:** ${{ github.ref_name }}
          • **상세 내용:** ${DETAILS}
          • **Action 링크:** ${ACTION_URL}"

          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$MESSAGE" '{content: $content}')" \
            "$DISCORD_WEBHOOK_URL"
